name: PR title

# With squash merges the PR title becomes the commit on main, so it must be
# a Conventional Commit: `type(scope): subject`, scope optional.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  semantic-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    # Reads only the PR title through the API. Never checks out PR code, which
    # is what keeps pull_request_target safe here.
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
          scopes: |
            mobile
            web
            admin
            desktop
            cli
            docs
            backend
            ui
            config
            ci
            deps
            repo
          requireScope: false
          # Subject must not start with an uppercase letter.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >-
            The subject "{subject}" in "{title}" must start with a lowercase
            letter, e.g. "feat(web): add sign-in page".
