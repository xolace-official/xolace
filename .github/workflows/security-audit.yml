name: Security audit

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - bun.lock
      - "**/package.json"
      - .github/workflows/security-audit.yml
  push:
    branches: [main]
    paths:
      - bun.lock
      - "**/package.json"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: bun audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      # bun audit (bun >= 1.2.15) exits non-zero when an advisory at or above
      # --audit-level is found. Ignore a specific advisory, with a reason in the
      # PR, via `--ignore=<GHSA/CVE id>`.
      #
      # Ignored (no patched release exists for any; re-check when one ships):
      # - GHSA-vfj7-8cjw-p6xm braces <=3.0.3: stack exhaustion on crafted glob
      #   patterns. Build tooling only (micromatch via Expo, RN, Sentry,
      #   shadcn), fed our own config globs, never user input.
      # - GHSA-86w9-cpqp-85rv node-forge <=1.4.0: lax RSA signature parsing.
      #   Only expo-updates' code-signing CLI uses it, on a dev machine; devices
      #   verify updates natively, so it never ships in the app.
      # - GHSA-mrhx-c7xc-m3w5 zod <4.6.6: memory exhaustion validating oversized
      #   constrained collections. Fixed only in 4.6.6; our own zod is 4.x and
      #   patched. The flagged copy is zod@3.25.76 nested under @expo/cli (the
      #   latest @expo/cli still pins ^3.25.76), which validates local config
      #   on a dev machine and is never bundled into the app.
      # - GHSA-fc5q-39xc-vjpf picomatch <=4.0.7: ReDoS when matching against a
      #   crafted extglob *pattern* such as +(*a). Every release is affected
      #   (4.0.7 is the latest), so no override can fix it yet. Our copies
      #   (4.0.7, plus 2.3.2 under micromatch and jest-util) are reached only
      #   through dev and build tooling: knip, vite/vitest, typescript-eslint,
      #   expo CLI, metro and config plugins, react-native's codegen/SPM
      #   scripts, fumadocs-mdx, shadcn's dotenvx and ultracite's fast-glob.
      #   None of our source imports a glob library, no app bundle or server
      #   runtime loads one, and the patterns are our own config, never user
      #   input. Remove this once picomatch ships a fix past 4.0.7: override
      #   the 4.x copy to it in the root package.json, and check whether the
      #   2.x copies still trip the audit (micromatch and jest-util need ^2).
      - run: >-
          bun audit --audit-level=high
          --ignore=GHSA-vfj7-8cjw-p6xm
          --ignore=GHSA-86w9-cpqp-85rv
          --ignore=GHSA-mrhx-c7xc-m3w5
          --ignore=GHSA-fc5q-39xc-vjpf
