name: Mobile release

# Backend first, then mobile (plan Phase 3).
#
# The web Vercel build is the only thing that deploys Convex
# (apps/web/scripts/vercel-build.ts). When Vercel reports a successful
# *Production* deployment of the web project, Convex prod is already on the new
# code, so it is safe to start the EAS release workflow
# (apps/mobile/.eas/workflows/release.yml: fingerprint -> OTA or store build).
# That EAS workflow has no push trigger; this is its only automatic trigger.
#
# Guards, all required:
#   - the deployment status is `success` and was created by vercel[bot];
#   - its environment is exactly vars.VERCEL_WEB_PRODUCTION_ENVIRONMENT
#     (the name Vercel gives the web project's Production environment, e.g.
#     "Production" or "Production – xolace-web"). Unset = nothing releases.
#     This keeps Preview deployments and the admin project out;
#   - the deployed commit is on main.
#
# Manual runs (workflow_dispatch) release the tip of main only.

on:
  deployment_status:
  workflow_dispatch:

# One release at a time, never cancelled half-way.
concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  EAS_CLI_VERSION: 24.12.1

jobs:
  release:
    name: Start EAS release workflow
    # Cheap pre-filter so Preview deployments don't even start a runner.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.creator.login == 'vercel[bot]' &&
       startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Decide whether to release
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEPLOY_ENV: ${{ github.event.deployment.environment }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url }}
          WEB_PROD_ENV: ${{ vars.VERCEL_WEB_PRODUCTION_ENVIRONMENT }}
          RUN_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF" != "refs/heads/main" ]]; then
              echo "::error::Manual mobile releases run from main only (got $REF)."
              exit 1
            fi
            echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$WEB_PROD_ENV" ]]; then
            echo "::warning::vars.VERCEL_WEB_PRODUCTION_ENVIRONMENT is not set; not releasing. Set it to the web project's Vercel Production environment name (deployment seen: '$DEPLOY_ENV')."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$DEPLOY_ENV" != "$WEB_PROD_ENV" ]]; then
            echo "::notice::Deployment environment '$DEPLOY_ENV' is not the web Production environment; not releasing."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Web Production deployed $DEPLOY_SHA ($DEPLOY_URL); Convex prod is on this commit."
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Check out the deployed commit
        if: steps.gate.outputs.release == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the commit to be on main
        if: steps.gate.outputs.release == 'true'
        env:
          SHA: ${{ steps.gate.outputs.sha }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main; refusing to release mobile from it."
            exit 1
          fi

      # eas-cli evaluates apps/mobile/app.config.ts, which needs the workspace
      # installed. No lifecycle scripts: nothing native runs here.
      - name: Setup workspace
        if: steps.gate.outputs.release == 'true'
        uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
          ignore-scripts: "true"

      - name: Run EAS release workflow
        if: steps.gate.outputs.release == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # app.config.ts throws on missing build env vars when CI=true. Those
          # values live in EAS env and are only needed on the EAS runners; here
          # eas-cli only reads the project id.
          CI: "false"
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::The EXPO_TOKEN secret is not set."
            exit 1
          fi
          bunx "eas-cli@${EAS_CLI_VERSION}" workflow:run .eas/workflows/release.yml --non-interactive
