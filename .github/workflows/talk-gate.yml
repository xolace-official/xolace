name: Talk gate

# #605: a change to the companion's prompt, safety skill, crisis line, model
# or turn assembly must pass the talk eval before it ships. Plays ~36 scripted
# talks against the live model with a Sonnet judge per turn, so it only runs
# when one of these moves.
on:
  pull_request:
    branches: [dev, default]
    paths:
      - convex/ai/prompts/companion.ts
      - convex/ai/talk/**
      - convex/ai/providers/anthropic.ts
      - convex/talk/safety.ts
      - convex/talk/safetyScript.ts
      - convex/talk/memory.ts
      - convex/talk/clock.ts
      - convex/talk/transcript.ts
      - convex/ai/prompts/__evals__/talk*
      - convex/ai/prompts/__evals__/harness.eval.ts
      - .github/workflows/talk-gate.yml
      - package.json
  workflow_dispatch:

jobs:
  talk:
    name: Talk eval
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # vitest runs under Node via its shebang (see ci.yml).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Without the key the eval skips, and a skipped gate would read green.
      - name: Require ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set; the talk gate cannot run."
            exit 1
          fi

      - name: Run talk eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run test:evals:talk
