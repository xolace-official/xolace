name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# PRs: a new push cancels the run in progress. main: every commit finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  # Turborepo remote cache. Optional: when the secret/variable are not set
  # (forks, or before the cache is configured) turbo falls back to the local
  # `.turbo/cache` restored by the setup action.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Decides what the rest of the workflow runs.
  #
  # Fail-safe by design: `code` is true for ANY changed path that is not on the
  # short docs/agent-context allowlist below, so an unknown path runs
  # everything. Events other than pull_request/push also run everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files through the API
    outputs:
      code: ${{ steps.result.outputs.code }}
      desktop: ${{ steps.result.outputs.desktop }}
      backend: ${{ steps.result.outputs.backend }}
      affected: ${{ steps.result.outputs.affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `every`: a file counts as code only if it matches ALL patterns, i.e. it
      # is not excluded by any of the negations.
      - name: Filter code changes
        id: code
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.agents/**'
              - '!.claude/**'
              - '!.cursor/**'
              - '!.codex/**'
              - '!.zed/**'
              - '!.vscode/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/CODEOWNERS'
              - '!.git-blame-ignore-revs'
              - '!LICENSE'

      - name: Filter area changes
        id: areas
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            desktop:
              - 'apps/desktop/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'packages/backend/**'
              - '.github/workflows/ci.yml'
            # Files outside any workspace package that change how every package
            # builds. turbo --affected does not see these, so run everything.
            global:
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'turbo.json'
              - 'biome.json'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

      - name: Resolve outputs
        id: result
        env:
          EVENT: ${{ github.event_name }}
          CODE: ${{ steps.code.outputs.code }}
          DESKTOP: ${{ steps.areas.outputs.desktop }}
          BACKEND: ${{ steps.areas.outputs.backend }}
          GLOBAL: ${{ steps.areas.outputs.global }}
        run: |
          if [[ "$EVENT" != "pull_request" && "$EVENT" != "push" ]]; then
            # Manual / unknown trigger: run everything, no --affected.
            {
              echo "code=true"
              echo "desktop=true"
              echo "backend=true"
              echo "affected="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A missing filter result is treated as "changed" (fail-safe).
          code="${CODE:-true}"
          {
            echo "code=$code"
            echo "desktop=${DESKTOP:-true}"
            echo "backend=${BACKEND:-true}"
            if [[ "${GLOBAL:-true}" == "true" ]]; then
              echo "affected="
            else
              echo "affected=--affected"
            fi
          } >> "$GITHUB_OUTPUT"

  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
          ignore-scripts: "true"
      - run: bun run check

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # turbo --affected compares against this commit. Needs full history.
      # On a push with no previous commit (all zeros) turbo cannot resolve the
      # range and treats every file as changed, which is the safe default.
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ignore-scripts: "true"
      - run: bunx turbo run check-types ${AFFECTED:+"$AFFECTED"}
        env:
          AFFECTED: ${{ needs.changes.outputs.affected }}

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ignore-scripts: "true"
      - run: bunx turbo run test ${AFFECTED:+"$AFFECTED"}
        env:
          AFFECTED: ${{ needs.changes.outputs.affected }}

  build:
    name: Build (web, admin, docs, cli)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
      # The Next apps validate env with Varlock (.env.schema) at build time, so
      # the build fails without these. They are deliberately FAKE placeholders
      # in the right shape, so the build works on forks and without secrets.
      # Nothing built here is deployed; real values live in Vercel env.
      # The Clerk key is `pk_test_` + base64("placeholder.clerk.accounts.dev$"),
      # which is the format Clerk parses; it points at no real instance.
      NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA==
      CLERK_SECRET_KEY: sk_test_placeholder_not_a_real_key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ignore-scripts: "true"
      # desktop needs Rust (see the desktop job); mobile builds go through EAS.
      - run: >-
          bunx turbo run build ${AFFECTED:+"$AFFECTED"}
          --filter='!@xolace/desktop'
          --filter='!@xolace/mobile'
        env:
          # "--affected", or empty to build everything (see the changes job).
          AFFECTED: ${{ needs.changes.outputs.affected }}

  # Checks that packages/backend/convex/_generated matches the functions.
  # `convex codegen` needs a deployment to talk to, so this job needs the
  # CONVEX_CODEGEN_DEPLOY_KEY secret (use a dev/preview deploy key, never the
  # production one). Without it (forks, or before it is configured) the job
  # only warns.
  codegen:
    name: Convex codegen drift
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_CODEGEN_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip without deploy key
        id: key
        run: |
          if [[ -z "$CONVEX_DEPLOY_KEY" ]]; then
            echo "::warning title=Convex codegen drift skipped::CONVEX_CODEGEN_DEPLOY_KEY is not set"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.present == 'true'
        uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - if: steps.key.outputs.present == 'true'
        working-directory: packages/backend
        run: bunx convex codegen --typecheck disable
      - if: steps.key.outputs.present == 'true'
        name: Fail on drift
        run: |
          if ! git diff --exit-code -- packages/backend/convex/_generated; then
            echo "::error::convex/_generated is out of date. Run 'bunx convex codegen' in packages/backend and commit the result."
            exit 1
          fi

  desktop:
    name: Desktop (cargo check)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust version
        run: |
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
      # tauri's generate_context! macro fails at compile time if
      # build.frontendDist (../../web/out) does not exist. cargo check does not
      # need the real web export, so a stub page is enough.
      - name: Stub web export
        run: |
          mkdir -p ../../web/out
          echo '<!doctype html><title>stub</title>' > ../../web/out/index.html
      - run: cargo check --locked

  # The single required status check for branch protection. Passes when every
  # job above either succeeded or was skipped; fails on any failure/cancel.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, lint, typecheck, test, build, codegen, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [[ -n "$failed" ]]; then
            echo "::error::Failed or cancelled jobs: $failed"
            exit 1
          fi
