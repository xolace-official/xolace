name: Setup workspace
description: >-
  Install the pinned bun version (from package.json "packageManager"), restore
  the bun install cache and the local Turborepo cache, then run
  `bun install --frozen-lockfile`.

inputs:
  turbo-cache:
    description: Restore and save the local `.turbo/cache` directory.
    required: false
    default: "true"
  turbo-cache-key:
    description: >-
      Extra key segment for the turbo cache, so jobs that run different tasks
      do not overwrite each other's cache entries. Defaults to the job id.
    required: false
    default: ""
  ignore-scripts:
    description: >-
      Install with `--ignore-scripts`. For jobs that only read source (lint,
      typecheck, test, web builds): dependency lifecycle scripts there only
      fetch native assets nothing in CI uses (react-native-enriched-markdown
      alone downloads ~30s of tree-sitter and RaTeX sources), print banners,
      or install git hooks. Leave it off for anything that runs native
      tooling or relies on the root `prepare` script.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install bun (version from package.json packageManager)
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json

    - name: Restore bun install cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Restore turbo cache
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        # Each run saves a fresh entry (keyed by sha); restore-keys picks up the
        # most recent entry for this job so unchanged packages hit the cache.
        key: turbo-${{ runner.os }}-${{ inputs.turbo-cache-key || github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.turbo-cache-key || github.job }}-

    - name: Install dependencies
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        if [[ "$IGNORE_SCRIPTS" == "true" ]]; then
          bun install --frozen-lockfile --ignore-scripts
        else
          bun install --frozen-lockfile
        fi
