<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live Flux</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="{{rootStyle}}">
  <style>
    @keyframes flx-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes flx-bounce{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-16px) scale(.96,1.05)}60%{transform:translateY(0) scale(1.05,.95)}}
    @keyframes flx-talkbody{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
    @keyframes flx-lean{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(-7deg) translateY(-3px)}}
    @keyframes flx-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
    @keyframes flx-mouth{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
    @keyframes flx-ring{from{transform:scale(.75);opacity:.55}to{transform:scale(1.35);opacity:0}}
    @keyframes flx-ember{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-130px);opacity:0}}
    @keyframes flx-dot{0%,100%{opacity:.15}50%{opacity:1}}
    @keyframes flx-shadow{0%,100%{transform:scaleX(1);opacity:.35}50%{transform:scaleX(.86);opacity:.22}}
  </style>
  <svg viewBox="0 0 200 230" width="100%" height="100%" role="img" aria-label="{{label}}" style="overflow: visible">
    <defs>
      <linearGradient id="flx-g-{{tint}}" x1="0.15" y1="0" x2="0.85" y2="1">
        <stop offset="0" stop-color="{{c0}}"></stop>
        <stop offset="0.3" stop-color="{{c1}}"></stop>
        <stop offset="0.55" stop-color="{{c2}}"></stop>
        <stop offset="0.8" stop-color="{{c3}}"></stop>
        <stop offset="1" stop-color="{{c4}}"></stop>
      </linearGradient>
    </defs>

    <ellipse cx="100" cy="218" rx="48" ry="7" fill="#000000" style="transform-box: fill-box; transform-origin: center; animation: flx-shadow 3.2s ease-in-out infinite"></ellipse>

    <g style="{{ringsStyle}}">
      <circle cx="100" cy="122" r="86" fill="none" stroke="#E8AA4E" stroke-width="2" style="transform-box: fill-box; transform-origin: center; animation: flx-ring 1.8s ease-out infinite"></circle>
      <circle cx="100" cy="122" r="86" fill="none" stroke="#E8AA4E" stroke-width="2" style="transform-box: fill-box; transform-origin: center; animation: flx-ring 1.8s ease-out .9s infinite"></circle>
    </g>

    <g style="{{bodyStyle}}">
      <path d="M92 8 C100 40 118 54 131 46 C136 42 140 34 142 26 C152 52 170 82 170 122 C170 170 138 204 100 204 C62 204 30 170 30 124 C30 82 70 48 92 8 Z" fill="url(#flx-g-{{tint}})"></path>
      <ellipse cx="68" cy="84" rx="13" ry="24" fill="#FFFFFF" opacity="0.35" transform="rotate(-24 68 84)"></ellipse>
      <ellipse cx="62" cy="152" rx="13" ry="7" fill="#FF7FA8" opacity="0.4"></ellipse>
      <ellipse cx="138" cy="152" rx="13" ry="7" fill="#FF7FA8" opacity="0.4"></ellipse>

      <g style="{{eyesStyle}}">
        <g style="transform-box: fill-box; transform-origin: center; animation: flx-blink 4.4s ease-in-out infinite">
          <ellipse cx="76" cy="128" rx="12" ry="15" fill="#141018"></ellipse>
          <ellipse cx="124" cy="128" rx="12" ry="15" fill="#141018"></ellipse>
          <circle cx="80" cy="121" r="4" fill="#FFFFFF"></circle>
          <circle cx="128" cy="121" r="4" fill="#FFFFFF"></circle>
        </g>
      </g>
      <g style="{{happyEyesStyle}}">
        <path d="M63 132 Q76 116 89 132" fill="none" stroke="#141018" stroke-width="5" stroke-linecap="round"></path>
        <path d="M111 132 Q124 116 137 132" fill="none" stroke="#141018" stroke-width="5" stroke-linecap="round"></path>
      </g>

      <path d="M89 158 Q100 167 111 158" fill="none" stroke="#141018" stroke-width="4" stroke-linecap="round" style="{{m.idle}}"></path>
      <ellipse cx="100" cy="161" rx="5" ry="6" fill="#3A1A22" style="{{m.listening}}"></ellipse>
      <path d="M92 161 L109 158" fill="none" stroke="#141018" stroke-width="4" stroke-linecap="round" style="{{m.thinking}}"></path>
      <ellipse cx="100" cy="161" rx="9" ry="8" fill="#3A1A22" style="{{m.talking}}"></ellipse>
      <path d="M83 154 Q100 176 117 154 Z" fill="#3A1A22" style="{{m.happy}}"></path>
    </g>

    <g style="{{dotsStyle}}">
      <circle cx="160" cy="44" r="5" fill="#ECEBF3" style="animation: flx-dot 1.2s ease-in-out infinite"></circle>
      <circle cx="174" cy="30" r="6" fill="#ECEBF3" style="animation: flx-dot 1.2s ease-in-out .3s infinite"></circle>
      <circle cx="190" cy="14" r="7" fill="#ECEBF3" style="animation: flx-dot 1.2s ease-in-out .6s infinite"></circle>
    </g>

    <g style="{{embersStyle}}">
      <circle cx="40" cy="200" r="3" fill="#E8AA4E" style="animation: flx-ember 2.6s ease-out infinite"></circle>
      <circle cx="160" cy="196" r="2.5" fill="#F0BC6A" style="animation: flx-ember 3.1s ease-out .7s infinite"></circle>
      <circle cx="58" cy="210" r="2" fill="#E8AA4E" style="animation: flx-ember 2.2s ease-out 1.3s infinite"></circle>
      <circle cx="146" cy="214" r="3" fill="#E8AA4E" style="animation: flx-ember 2.8s ease-out 1.9s infinite"></circle>
    </g>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["idle","listening","thinking","talking","happy"],"default":"talking"},"tint":{"editor":"enum","options":["flux","sage","wren","vesper","ash"],"default":"flux"},"size":{"editor":"int","default":260,"min":60,"max":600},"$preview":{"width":260,"height":300}}'>
const TINTS = {
  flux: ['#7FD8F2', '#FFE08A', '#FFB59A', '#F6A3D6', '#A9A4F5'],
  sage: ['#C8F0DC', '#A8E6CF', '#8FD3B6', '#74C69D', '#5FB38B'],
  wren: ['#FFE1B8', '#FFC6A5', '#F7A8A0', '#F09AB8', '#CDB4DB'],
  vesper: ['#D9CCF5', '#B8B0F7', '#9F8BE8', '#8278F0', '#6D5BD0'],
  ash: ['#E4ECF5', '#C6D3E6', '#A9BCD9', '#90A7CB', '#7D93B8'],
};
const LABELS = { idle: 'resting', listening: 'listening', thinking: 'thinking', talking: 'talking', happy: 'happy' };
const SHOW = 'display: inline';
const HIDE = 'display: none';
const ORIGIN = 'transform-box: fill-box; transform-origin: 50% 100%; ';

class Component extends DCLogic {
  renderVals() {
    const mood = this.props.mood ?? 'talking';
    const tint = TINTS[this.props.tint] ? this.props.tint : 'flux';
    const size = this.props.size ?? 260;
    const c = TINTS[tint];
    const bodyAnim = {
      idle: 'flx-bob 3.2s ease-in-out infinite',
      listening: 'flx-lean 2.4s ease-in-out infinite',
      thinking: 'flx-bob 4s ease-in-out infinite',
      talking: 'flx-talkbody .36s ease-in-out infinite',
      happy: 'flx-bounce 1.1s ease-in-out infinite',
    }[mood] || 'none';
    const eyesShift = mood === 'thinking' ? 'transform: translate(5px, -7px);' : mood === 'listening' ? 'transform: scale(1.08);' : '';
    const vis = (m) => (mood === m ? SHOW : HIDE);
    return {
      rootStyle: 'width: ' + size + 'px; height: ' + Math.round(size * 1.154) + 'px; position: relative',
      label: 'Flux, ' + (LABELS[mood] || 'resting'),
      tint, c0: c[0], c1: c[1], c2: c[2], c3: c[3], c4: c[4],
      bodyStyle: ORIGIN + 'animation: ' + bodyAnim,
      eyesStyle: 'transform-box: fill-box; transform-origin: center; transition: transform .4s ease; ' + eyesShift + (mood === 'happy' ? HIDE : SHOW),
      happyEyesStyle: mood === 'happy' ? SHOW : HIDE,
      m: {
        idle: vis('idle'),
        listening: vis('listening'),
        thinking: vis('thinking'),
        happy: vis('happy'),
        talking: 'transform-box: fill-box; transform-origin: center; animation: flx-mouth .18s ease-in-out infinite alternate; ' + vis('talking'),
      },
      ringsStyle: mood === 'listening' ? SHOW : HIDE,
      dotsStyle: mood === 'thinking' ? SHOW : HIDE,
      embersStyle: mood === 'talking' || mood === 'happy' || mood === 'listening' ? SHOW : HIDE,
    };
  }
}
</script>
</body>
</html>
