executionPrerequisite: Xolace dev build (__DEV__, so Dev tools render) signed in, on any screen with no composer or sheet open.
steps:
  - echo: Clear any tour an aborted earlier run left pending (it would draw over Settings)
  - tool: open-url
    args: { url: "xolace://" }
  - await: { visible: "Tap to begin writing", timeout: 15000 }
  - wait: 1500
  - when: { visible: "End tour" }
    steps:
      - tap: { text: Skip }
  - echo: 'Dev tools → "Starter suggestions · as new user": seen=false, tour unfinished, account treated as zero-session'
  - tool: open-url
    args: { url: "xolace://settings/account" }
  - await: { exists: "Sign-in method", timeout: 15000 }
  - scroll-to: "Starter suggestions · as new user"
  - tap: { text: "Starter suggestions · as new user" }
  - run: starter-tour-then-bubble
