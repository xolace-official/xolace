executionPrerequisite: Home with the Reflect tour about to start (tour unfinished) and the account eligible for Starter suggestions.
steps:
  - echo: The action returns home, as a first run → the Reflect tour opens first, with no bubble on top of it
  - await: { visible: "Step 1 of 4", timeout: 15000 }
  - assert: { hidden: "Where would you like to start?" }
  - tap: { text: Next }
  - await: { visible: "Step 2 of 4" }
  - tap: { text: Next }
  - await: { visible: "Step 3 of 4" }
  - tap: { text: Next }
  - await: { visible: "Step 4 of 4" }
  - assert: { hidden: "Where would you like to start?" }
  - tap: { text: Done }
  - echo: Tour resolved → Starter suggestions follow as the last home link
  - await: { visible: "Where would you like to start?", timeout: 10000 }
  - assert: { visible: "Suggested for you" }
  - assert: { visible: "Close suggestions" }
