steps:
  - echo: 'No stacking: with a follow-up check-in due, home shows the check-in alone; the tour and then the bubble wait their turn.'
  - launch: com.xolaceincorg.xolace.dev
  - await: { visible: "Tap to begin writing", timeout: 30000 }
  - wait: 1500
  - when: { visible: "End tour" }
    steps:
      - tap: { text: Skip }
  - tool: open-url
    args: { url: "xolace://settings/account" }
  - await: { exists: "Sign-in method", timeout: 15000 }
  - echo: Seed a ready follow-up card (needs DEV_TOOLS_ENABLED on the dev deployment)
  - scroll-to: "Seed follow-up · standard"
  - tap: { text: "Seed follow-up · standard" }
  - await: { visible: "Follow-up card seeded", timeout: 10000 }
  - scroll-to: "Starter suggestions · as new user"
  - tap: { text: "Starter suggestions · as new user" }
  - echo: Home → the check-in takes the screen; no tour, no bubble over it
  # Raw tools: the pushed check-in screen is missing from the full native hierarchy.
  - tool: await-ui-element
    args: { condition: visible, selector: { text: "Checking back in" }, timeoutMs: 15000 }
  - wait: 3000
  - tool: await-ui-element
    args: { condition: hidden, selector: { text: "Where would you like to start?" } }
  - tool: await-ui-element
    args: { condition: hidden, selector: { text: "Step 1 of 4" } }
  - echo: Close the check-in (✕, top right) → the chain resumes on home
  - tap: { x: 0.901, y: 0.103 }
  - run: starter-tour-then-bubble
  - tap: { text: "Close suggestions" }
  - await: { hidden: "Where would you like to start?" }
