steps:
  - echo: Each suggestion lands where it says. Re-armed before every row, since a tap resolves the bubble.
  - launch: com.xolaceincorg.xolace.dev
  - await: { visible: "Tap to begin writing", timeout: 30000 }

  - run: starter-arm
  - echo: Reflect → the composer opens over home (nothing is submitted)
  - tap: { text: "Reflect. Get clarity on what's on your mind" }
  - await: { visible: "Close the composer" }
  - assert: { hidden: "Where would you like to start?" }
  - tap: "Close the composer"
  - await: { visible: "Tap to begin writing" }

  - run: starter-arm
  - echo: Vent → voice vent
  - tap: { text: "Vent. Say it out loud" }
  - await: { visible: "This is a space to say the unsaid." }

  - run: starter-arm
  - echo: Lantern → the Library home
  - tap: { text: "Lantern. Read something that fits" }
  - await: { visible: { text: "For you" } }
  - assert: { visible: Lantern }

  - run: starter-arm
  - echo: Listen → Browse
  - tap: { text: "Listen. Music and support audio" }
  # Raw tool, not the directive: the full native hierarchy misses the Browse hub; the AX tree has it.
  - tool: await-ui-element
    args: { condition: visible, selector: { text: "FEATURED THIS WEEK" }, timeoutMs: 10000 }

  - run: starter-arm
  - echo: Xolacer chat → the Xolacer roster on Connect, not a conversation
  - tap: { text: "Xolacer chat. Talk with someone who's been there" }
  # Raw tool, as for Browse: tab screens are missing from the full native hierarchy.
  - tool: await-ui-element
    args: { condition: visible, selector: { text: "Show Everyone" }, timeoutMs: 10000 }
  - tool: await-ui-element
    args: { condition: visible, selector: { text: "Xolacers" } }
