steps:
  - echo: 'Intake reorders, never hides (ADR-0017). The dev account''s intake has a no-words emotionAwareness, so Reflect drops to the bottom and the rest keep their default order: Vent, Lantern, Listen, Xolacer chat, Reflect.'
  - launch: com.xolaceincorg.xolace.dev
  - await: { visible: "Tap to begin writing", timeout: 30000 }
  - run: starter-arm
  - assert: { visible: { text: "Lantern. Read something that fits", after: { text: "Vent. Say it out loud" } } }
  - assert: { visible: { text: "Listen. Music and support audio", after: { text: "Lantern. Read something that fits" } } }
  - assert: { visible: { text: "Xolacer chat. Talk with someone who's been there", after: { text: "Listen. Music and support audio" } } }
  - assert: { visible: { text: "Reflect. Get clarity on what's on your mind", after: { text: "Xolacer chat. Talk with someone who's been there" } } }
  - assert: { hidden: { text: "Vent. Say it out loud", after: { text: "Reflect. Get clarity on what's on your mind" } } }
  - tap: { text: "Close suggestions" }
  - await: { hidden: "Where would you like to start?" }
