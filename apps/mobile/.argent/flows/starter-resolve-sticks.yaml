steps:
  - echo: A row tap, ✕ and tap-away each resolve the bubble for good — it does not come back after a relaunch.
  - launch: com.xolaceincorg.xolace.dev
  - await: { visible: "Tap to begin writing", timeout: 30000 }

  - run: starter-arm
  - echo: Resolve by ✕
  - tap: { text: "Close suggestions" }
  - await: { hidden: "Where would you like to start?" }
  - launch: com.xolaceincorg.xolace.dev
  - await: { visible: "Tap to begin writing", timeout: 30000 }
  - echo: The bubble would arrive ~0.5s after the card settles; give it well past that
  - wait: 4000
  - assert: { hidden: "Where would you like to start?" }

  - run: starter-arm
  - echo: Resolve by tapping away (the scrim above the bubble)
  - tap: { x: 0.5, y: 0.2 }
  - await: { hidden: "Where would you like to start?" }
  - launch: com.xolaceincorg.xolace.dev
  - await: { visible: "Tap to begin writing", timeout: 30000 }
  - wait: 4000
  - assert: { hidden: "Where would you like to start?" }

  - run: starter-arm
  - echo: Resolve by choosing a row (Listen)
  - tap: { text: "Listen. Music and support audio" }
  # Raw tool, not the directive: the full native hierarchy misses the Browse hub; the AX tree has it.
  - tool: await-ui-element
    args: { condition: visible, selector: { text: "FEATURED THIS WEEK" }, timeoutMs: 10000 }
  - launch: com.xolaceincorg.xolace.dev
  - await: { visible: "Tap to begin writing", timeout: 30000 }
  - wait: 4000
  - assert: { hidden: "Where would you like to start?" }
