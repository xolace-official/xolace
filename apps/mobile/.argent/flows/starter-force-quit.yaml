steps:
  - echo: Killing the app while the bubble is open does not resolve it — it is back on the next launch.
  - launch: com.xolaceincorg.xolace.dev
  - await: { visible: "Tap to begin writing", timeout: 30000 }
  - run: starter-arm
  - echo: Force-quit and relaunch with the bubble still open
  - launch: com.xolaceincorg.xolace.dev
  - await: { visible: "Where would you like to start?", timeout: 30000 }
  - echo: Clean up so later runs start from a resolved bubble
  - tap: { text: "Close suggestions" }
  - await: { hidden: "Where would you like to start?" }
