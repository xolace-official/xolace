steps:
  - echo: 'Real server gate. The dev account has sessions (sessionCount > 0), so even with the seen flag cleared the bubble never shows.'
  - launch: com.xolaceincorg.xolace.dev
  - await: { visible: "Tap to begin writing", timeout: 30000 }
  - echo: Positive control — on this build the bubble does show for a zero-session user
  - run: starter-arm
  - tap: { text: "Close suggestions" }
  - await: { hidden: "Where would you like to start?" }
  - echo: Now the real gate, with the seen flag cleared again
  - tool: open-url
    args: { url: "xolace://settings/account" }
  - await: { exists: "Sign-in method", timeout: 15000 }
  - scroll-to: "Starter suggestions · real gate"
  - tap: { text: "Starter suggestions · real gate" }
  - await: { visible: "Tap to begin writing", timeout: 15000 }
  - wait: 4000
  - assert: { hidden: "Where would you like to start?" }
  - echo: Still hidden after a cold launch
  - launch: com.xolaceincorg.xolace.dev
  - await: { visible: "Tap to begin writing", timeout: 30000 }
  - wait: 4000
  - assert: { hidden: "Where would you like to start?" }
